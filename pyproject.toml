[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-ai-publisher"
version = "0.1.0"
description = "OpenCode-orchestrated WordPress draft publisher"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "openpyxl>=3.1", "requests>=2.31", "pydantic>=2.7", "pydantic-settings>=2.2", "PyYAML>=6.0", "python-dotenv>=1.0", "Markdown>=3.6", "tenacity>=8.2"]

[project.scripts]
wp-ai-publisher = "wp_ai_publisher.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["wp_ai_publisher*"]
